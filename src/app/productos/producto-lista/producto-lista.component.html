<div class="container">

  <div class="align-items-center d-flex justify-content-between" style="margin: 30px">
    <h3 class="text-center flex-grow-1">Productos</h3>
    <button class="btn btn-success btn-sm ms-auto" (click)="modalAgregar()">Agregar Producto</button>
  </div>
    

      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr class="text-center">
            <th scope="col">Id</th>
            <th scope="col">Descripcion del Producto</th>
            <th scope="col">Precio</th>
            <th scope="col">Stock</th>
            <th scope="col">Categoria</th>
            <th scope="col">Codigo</th>  
            <th class="text-center" scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr class="text-center" *ngFor="let producto of productos">
            <th scope="row">{{ producto.idProducto }}</th>
            <td>{{ producto.descripcion }}</td>
            <td>{{ producto.precio }}</td>
            <td>{{ producto.stock }}</td>
            <td>{{ producto.categoria.nombre}}</td>
            <td>{{ producto.codigo }}</td>
            <td class="text-center">
              <button class="btn btn-warning btn-sm me-3" (click)="openByDocument(producto)">Editar</button>
              <button class="btn btn-danger btn-sm" (click)="eliminarProducto(producto.idProducto)">Eliminar</button>            
            </td>
          </tr>
        </tbody>
      </table>
</div>

<!-- Modal Agregar Producto -->
<div class="modal" id="modalAgregar">
  <div class="modal-dialog">  
    <div class="modal-content">
      
      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">Crear Producto</h4>
        <button type="button" class="btn-close" (click)="cerrarModalAgregar()" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripcion del Producto</label>
          <input type="text" id="descripcion" class="form-control" [(ngModel)]="nuevoProducto.descripcion">
        </div>
        <div class="mb-3">
          <label for="precio" class="form-label">Precio</label>
          <input type="text" id="precio" class="form-control" [(ngModel)]="nuevoProducto.precio">
        </div>
        <div class="mb-3">
          <label for="stock" class="form-label">Stock</label>
          <input type="text" id="stock" class="form-control" [(ngModel)]="nuevoProducto.stock">
        </div>
        <div class="mb-3">
          <label for="codigo" class="form-label">Codigo</label>
          <input type="text" id="codigo" class="form-control" [(ngModel)]="nuevoProducto.codigo">
        </div>
        <div class="mb-3">
          <label for="categoria" class="form-label">Categoría</label>
          <select id="categoria" class="form-control" [(ngModel)]="nuevoProducto.categoria.id">
            <option *ngFor="let categoria of categorias" [value]="categoria.id">{{ categoria.nombre }}</option>
          </select>
        </div>
        
        
      </div> <!-- Cerramos modal-body aquí -->
      
      <!-- Modal footer -->
      <div class="modal-footer d-flex text-center justify-content-between">
        <button type="button" class="btn btn-success" (click)="agregarProducto()">Crear</button>
      </div>

    </div>
  </div>
</div>


<!--Modal Editar Producto-->

<div class="modal" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">Modal Heading</h4>
        <button type="button" class="btn-close" (click)="closeModelByDocument()" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body" *ngIf="productoEditado">
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripcion del Producto</label>
          <input type="text" id="descripcion" class="form-control" [(ngModel)]="productoEditado.descripcion">
        </div>
        <div class="mb-3">
          <label for="precio" class="form-label">Precio</label>
          <input type="text" id="precio" class="form-control" [(ngModel)]="productoEditado.precio">
        </div>
        <div class="mb-3">
          <label for="stock" class="form-label">Stock</label>
          <input type="text" id="stock" class="form-control" [(ngModel)]="productoEditado.stock">
        </div>
        <div class="mb-3">
          <label for="codigo" class="form-label">Codigo</label>
          <input type="text" id="codigo" class="form-control" [(ngModel)]="productoEditado.codigo">
        </div>
        <div class="mb-3">
          <label for="categoria" class="form-label">Categoría</label>
          <select id="categoria" class="form-control" [(ngModel)]="productoEditado.categoria.id">
            <option *ngFor="let categoria of categorias" [value]="categoria.id">
              {{ categoria.nombre }}
            </option>
          </select>
        </div>
      <div class="modal-footer d-flex text-center justify-content-between">
        <button type="button" class="btn btn-danger" (click)="closeModelByDocument()">Cerrar</button>
        <button type="button" class="btn btn-success" (click)="actualizarProducto()">Actualizar</button>
      </div>
