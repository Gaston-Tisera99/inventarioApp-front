<div class="container">
  <div class="d-flex justify-content-between align-items-center" style="margin: 30px">
    <h3 class="text-center">Categorias</h3>
    <button class="btn btn-primary" (click)="modalAgregar()">Agregar Categoría</button>
  </div>

  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr class="text-center">
        <th scope="col">Id</th>
        <th scope="col">Nombre</th>
        <th scope="col">Descripcion</th>
        <th scope="col">Fecha de Creacion</th>
        <th scope="col">Estado</th>
        <th class="text-center" scope="col">Acciones</th> 
      </tr>
    </thead>
    <tbody>
      <tr class="text-center" *ngFor="let categoria of categorias">
        <th scope="row">{{categoria.id}}</th>
        <td>{{categoria.nombre}}</td>
        <td>{{categoria.descripcion}}</td>
        <td>{{getFormattedDate(categoria.datacreated)}}</td>
        <td>{{ categoria.status === 1 ? 'Activo' : 'Inactivo' }}</td>
        <td class="text-center">
          <button 
            class="btn btn-sm me-3" 
            [ngClass]="categoria.status === 1 ? 'btn-warning' : 'btn-success'" 
            (click)="toggleStatus(categoria)">
             {{ categoria.status === 1 ? 'Inhabilitar' : 'Habilitar' }}
          </button>
          <button class="btn btn-warning btn-sm me-3" (click)="modalEditar(categoria)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="eliminarCategoria(categoria.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal CREAR CATEGORIA -->
<div class="modal" id="modalAgregarCategoria">
  <div class="modal-dialog">  
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">Crear Categoria</h4>
        <button type="button" class="btn-close" (click)="cerrarModalAgregar()" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control" [(ngModel)]="nuevaCategoria.nombre">
        </div>
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripcion</label>
          <input type="text" id="descripcion" class="form-control" [(ngModel)]="nuevaCategoria.descripcion">
        </div>
        <select id="status" class="form-control" [(ngModel)]="nuevaCategoria.status">
          <option [value]="1">Activo</option>
          <option [value]="2">Inactivo</option>
        </select>
      </div>
      

      <!-- Modal footer -->
      <div class="modal-footer d-flex text-center justify-content-between">
        <button type="button" class="btn btn-danger" (click)="cerrarModalAgregar()">Cerrar</button>
        <button type="button" class="btn btn-success" (click)="AgregarCategoria()">Crear</button>
      </div>

    </div>
  </div>
</div>
<!-- FIN de  Modal CREAR CATEGORIA -->

<div class="modal" id="modalEditarCategoria">
  <div class="modal-dialog">  
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">Crear Categoria</h4>
        <button type="button" class="btn-close" (click)="cerrarModalEditar()" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body" *ngIf="categoriaEditado">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control" [(ngModel)]="categoriaEditado.nombre">
        </div>
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripcion</label>
          <input type="text" id="descripcion" class="form-control" [(ngModel)]="categoriaEditado.descripcion">
        </div>
        <select id="status" class="form-control" [(ngModel)]="categoriaEditado.status">
          <option [value]="1">Activo</option>
          <option [value]="2">Inactivo</option>
        </select>
      </div>
      
      <!-- Modal footer -->
      <div class="modal-footer d-flex text-center justify-content-between">
        <button type="button" class="btn btn-danger" (click)="cerrarModalEditar()">Cerrar</button>
        <button type="button" class="btn btn-success" (click)="ActualizarCategoria()">Editar</button>
      </div>

    </div>
  </div>
</div>
